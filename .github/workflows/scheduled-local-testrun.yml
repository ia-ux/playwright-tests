name: Scheduled Local Test Run on Mac mini

# SECURITY: this workflow runs on our own hardware and the repo is public, so it
# must never gain a `pull_request` trigger. That would let anyone run arbitrary
# code on the mini by opening a PR from a fork. Fork PRs belong on
# ubuntu-latest, which is what main.yml already does.
on:
  schedule:
    # Hourly at :30, offset from the BrowserStack run. The interval has to stay
    # comfortably longer than the suite takes: a run that overran its hour would
    # be followed immediately by the queued one, and archive.org throttles the
    # search backend when it sees two full suites back to back from one IP.
    - cron: '30 * * * *'
  workflow_dispatch:

# Deliberately a different group from `browserstack-tests`. These runs come from
# our own IP rather than BrowserStack's, so they don't add to the concurrent
# load that the BrowserStack runs are serialized to avoid.
concurrency:
  group: mac-mini-tests
  cancel-in-progress: false

# The job only reads the repo. The org default is a write token, and on a
# self-hosted runner actions/checkout leaves that token on disk in .git/config
# between runs, so narrow it here.
permissions:
  contents: read

jobs:
  test:
    name: Run tests
    runs-on: [self-hosted, macOS, ARM64, playwright-mini]
    # Playwright's own globalTimeout is 45 min; this is the backstop for a
    # wedged runner, not for a slow suite.
    timeout-minutes: 60
    env:
      ARCHIVE_EMAIL: ${{ secrets.ARCHIVE_EMAIL }}
      ARCHIVE_PASSWORD: ${{ secrets.ARCHIVE_PASSWORD }}
      PATRON_EMAIL: ${{ secrets.PATRON_EMAIL }}
      PATRON_PASSWORD: ${{ secrets.PATRON_PASSWORD }}
      # Real Google Chrome, the same channel the BrowserStack runs exercise.
      PLAYWRIGHT_CHANNEL: chrome
      # playwright.config.ts builds the report path from this.
      CATEGORY: mac-mini
      CI: true

    steps:
      - uses: actions/checkout@v4
        with:
          # Nothing here runs git after checkout, so don't leave the token
          # sitting in .git/config on a machine we keep around.
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # A run killed by timeout-minutes or a cancel doesn't get Playwright's
      # graceful browser shutdown, and this runner is not ephemeral, so the
      # orphaned Chrome processes and profile dirs would accumulate hourly.
      # The profile path pattern is Playwright's own, so this can't match a
      # Chrome someone opened on the machine for another reason.
      - name: Reap leftovers from a killed run
        run: |
          pkill -f playwright_chromiumdev_profile || true
          rm -rf "${TMPDIR:-/tmp}"/playwright_chromiumdev_profile-* || true

      # A missing Chrome surfaces as an opaque Playwright launch error several
      # minutes into the run, so check for it up front.
      - name: Check Google Chrome is installed
        run: |
          if [ ! -x "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" ]; then
            echo "Google Chrome is not installed. Run: brew install --cask google-chrome"
            exit 1
          fi
          "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --version

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        id: tests
        run: bash run-tests.sh
        continue-on-error: true

      - name: Send Slack notification
        if: always()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          TEST_OUTCOME: ${{ steps.tests.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # GitHub runs this as `bash -e`, and a bare var=$(cmd) assignment
          # takes the substitution's exit status, so a jq failure here would
          # exit the step before curl and post nothing at all. Every
          # substitution gets `|| true`, and the report is checked for
          # parseability up front, so a bad report degrades to the plain
          # message rather than to silence. jq's stderr is left visible so a
          # shape change shows up in the run log.
          summary=""
          first_failure=""
          duration=""
          if [ -f playwright-results.json ] && jq -e . playwright-results.json >/dev/null 2>&1; then
            summary=$(jq -r '
              .stats
              | [ (if .unexpected > 0 then "\(.unexpected) failed" else empty end)
                , (if .flaky      > 0 then "\(.flaky) flaky"       else empty end)
                , "\(.expected) passed"
                , (if .skipped    > 0 then "\(.skipped) skipped"   else empty end)
                ]
              | join(", ")
            ' playwright-results.json) || true
            first_failure=$(jq -r '
              [ .. | objects | select(has("ok") and has("title") and .ok == false) ]
              | if length > 0 then "\n First failure: \(.[0].title)" else "" end
            ' playwright-results.json) || true
            duration=$(jq -r '
              .stats.duration
              | if type == "number" then floor | "\(. / 60000 | floor)m\((. % 60000) / 1000 | floor)s" else "" end
            ' playwright-results.json) || true
            [ -n "$summary" ] && [ -n "$duration" ] && summary="$summary ($duration)"
          fi

          case "$TEST_OUTCOME" in
            success) job_status="✅ ${summary:-All tests passed.}" ;;
            failure) job_status="‼️ ${summary:-Tests failed, check the run.}${first_failure}" ;;
            *)       job_status="❓ Something went wrong, check the run." ;;
          esac

          jq -n --arg text "[mac-mini] $job_status"$'\n'"View details in: $RUN_URL" \
            '{text: $text}' |
            curl -sS -X POST -H 'Content-type: application/json' \
              --data @- "$SLACK_WEBHOOK_URL"

      # continue-on-error above keeps the Slack step reachable, but the job
      # itself should still go red so the run history means something.
      - name: Fail the job if tests failed
        if: steps.tests.outcome == 'failure'
        run: exit 1
